name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      working-directory: ./typeform-app
      run: npm ci
      
    - name: Run linting
      working-directory: ./typeform-app
      run: npm run lint
      
    - name: Run type checking
      working-directory: ./typeform-app
      run: npm run type-check
      
    - name: Run unit tests
      working-directory: ./typeform-app
      run: npm run test:coverage
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./typeform-app/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        
    - name: Run ResponseProcessor specific tests
      working-directory: ./typeform-app
      run: npm run test -- ResponseProcessor
      
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: ./idurar-erp-crm/frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./idurar-erp-crm/frontend
      run: npm ci
      
    - name: Build application
      working-directory: ./idurar-erp-crm/frontend
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: ./idurar-erp-crm/frontend/dist
        retention-days: 7
        
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      working-directory: ./typeform-app
      run: npm ci
      
    - name: Run security audit
      working-directory: ./typeform-app
      run: npm audit --audit-level=moderate
      
    - name: Run dependency vulnerability check
      working-directory: ./typeform-app
      run: npx audit-ci --moderate
      
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      working-directory: ./typeform-app
      run: npm ci
      
    - name: Run Prettier check
      working-directory: ./typeform-app
      run: npm run format:check
      
    - name: Run ESLint
      working-directory: ./typeform-app
      run: npm run lint:report
      
    - name: Upload ESLint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: eslint-results
        path: ./typeform-app/eslint-report.json
        retention-days: 7

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      working-directory: ./typeform-app
      run: npm ci
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-files
        path: ./typeform-app/dist
        
    - name: Install Playwright browsers
      working-directory: ./typeform-app
      run: npx playwright install --with-deps
      
    - name: Run E2E tests
      working-directory: ./typeform-app
      run: npm run test:e2e
      
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: ./typeform-app/test-results/
        retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build, security, code-quality]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-files
        path: ./typeform-app/dist

        
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: scp, rsync, or cloud provider CLI commands
        
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test commands here

    - name: Run staging health checks
      run: |
        echo "Running staging health checks..."

    - name: Modify staging configuration
      run: |
        echo "Modifying staging configuration of <staging-environment>"
        # Add commands to modify staging configuration if needed

    - name :run staging specific tests
      run:|
        echo "Running staging specific activeClients next pattern worflow tests"    
        
        
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security, code-quality, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-files
        path: ./typeform-app/dist
        
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        
    - name: Run production health checks
      run: |
        echo "Running production health checks..."
        # Add health check commands here
        
    - name: Create release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release created by GitHub Actions
          
          Changes in this release:
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false

  notification:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success'
      run: |
        echo "Deployment successful! 🚀"
        # Add notification logic (Slack, Discord, email, etc.)
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "Deployment failed! ❌"
        # Add failure notification logic