<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Flight Booking - QR Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .flights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .flight-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .flight-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .airline-info {
            font-weight: 700;
            font-size: 1.2em;
            color: #667eea;
        }

        .flight-number {
            color: #666;
            font-size: 0.9em;
        }

        .route {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .city {
            font-size: 1.5em;
            font-weight: 700;
        }

        .airport {
            color: #666;
            font-size: 0.9em;
        }

        .route-arrow {
            color: #667eea;
            font-size: 1.5em;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            color: #666;
            margin-bottom: 15px;
        }

        .price-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .price {
            font-size: 1.8em;
            font-weight: 700;
            color: #10b981;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            font-size: 2em;
            cursor: pointer;
            color: #999;
        }

        .qr-container {
            text-align: center;
            padding: 30px;
            background: #f9fafb;
            border-radius: 10px;
            margin: 20px 0;
        }

        .qr-code {
            max-width: 300px;
            margin: 20px auto;
        }

        .boarding-pass {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .boarding-pass-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .boarding-pass-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .detail-value {
            font-size: 1.2em;
            font-weight: 700;
            margin-top: 5px;
        }

        .success-message {
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✈️ Flight Booking</h1>
            <p>Book your flight and pay with QR code</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <h2>🔍 Search Flights</h2>
            <div class="search-form">
                <div class="form-group">
                    <label>From</label>
                    <input type="text" id="fromCity" placeholder="e.g., Mumbai">
                </div>
                <div class="form-group">
                    <label>To</label>
                    <input type="text" id="toCity" placeholder="e.g., Delhi">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="flightDate" value="2025-12-15">
                </div>
                <div class="form-group">
                    <label>Passengers</label>
                    <select id="passengers">
                        <option value="1">1 Passenger</option>
                        <option value="2">2 Passengers</option>
                        <option value="3">3 Passengers</option>
                        <option value="4">4 Passengers</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" onclick="searchFlights()">Search Flights</button>
        </div>

        <!-- Flights Grid -->
        <div id="flightsContainer" class="flights-grid"></div>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✈️ Passenger Details</h2>
                <span class="close-btn" onclick="closeModal('bookingModal')">&times;</span>
            </div>
            <div id="bookingForm"></div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💳 QR Payment</h2>
                <span class="close-btn" onclick="closeModal('paymentModal')">&times;</span>
            </div>
            <div id="paymentContent"></div>
        </div>
    </div>

    <!-- Boarding Pass Modal -->
    <div id="boardingPassModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎟️ Boarding Pass</h2>
                <span class="close-btn" onclick="closeModal('boardingPassModal')">&times;</span>
            </div>
            <div id="boardingPassContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let selectedFlight = null;
        let currentBooking = null;

        // Load flights on page load
        window.onload = () => {
            loadAllFlights();
        };

        // Load all flights
        async function loadAllFlights() {
            try {
                const response = await fetch(`${API_URL}/flights`);
                const data = await response.json();
                displayFlights(data.flights);
            } catch (error) {
                console.error('Error loading flights:', error);
            }
        }

        // Search flights
        async function searchFlights() {
            const from = document.getElementById('fromCity').value;
            const to = document.getElementById('toCity').value;
            const date = document.getElementById('flightDate').value;
            const passengers = document.getElementById('passengers').value;

            try {
                const response = await fetch(`${API_URL}/flights/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from, to, date, passengers: parseInt(passengers) })
                });
                
                const data = await response.json();
                displayFlights(data.flights);
            } catch (error) {
                console.error('Error searching flights:', error);
            }
        }

        // Display flights
        function displayFlights(flights) {
            const container = document.getElementById('flightsContainer');
            
            if (flights.length === 0) {
                container.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">No flights found</p>';
                return;
            }

            container.innerHTML = flights.map(flight => `
                <div class="flight-card">
                    <div class="flight-header">
                        <div>
                            <div class="airline-info">${flight.airline}</div>
                            <div class="flight-number">${flight.flightNumber}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="color: #10b981; font-weight: 600;">${flight.class}</div>
                            <div style="color: #666; font-size: 0.9em;">${flight.availableSeats} seats</div>
                        </div>
                    </div>

                    <div class="route">
                        <div>
                            <div class="city">${flight.from.split('(')[0].trim()}</div>
                            <div class="airport">${flight.from.match(/\(([^)]+)\)/)[1]}</div>
                        </div>
                        <div class="route-arrow">✈️</div>
                        <div style="text-align: right;">
                            <div class="city">${flight.to.split('(')[0].trim()}</div>
                            <div class="airport">${flight.to.match(/\(([^)]+)\)/)[1]}</div>
                        </div>
                    </div>

                    <div class="time-info">
                        <div>
                            <div>Departure</div>
                            <div style="font-weight: 600;">${new Date(flight.departure).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</div>
                        </div>
                        <div style="text-align: center;">
                            <div>Duration</div>
                            <div style="font-weight: 600;">${flight.duration}</div>
                        </div>
                        <div style="text-align: right;">
                            <div>Arrival</div>
                            <div style="font-weight: 600;">${new Date(flight.arrival).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</div>
                        </div>
                    </div>

                    <div class="price-section">
                        <div class="price">₹${flight.price.toLocaleString('en-IN')}</div>
                        <button class="btn btn-primary" onclick='bookFlight(${JSON.stringify(flight)})'>Book Now</button>
                    </div>
                </div>
            `).join('');
        }

        // Book flight
        function bookFlight(flight) {
            selectedFlight = flight;
            const modal = document.getElementById('bookingModal');
            const form = document.getElementById('bookingForm');

            form.innerHTML = `
                <div style="background: #f9fafb; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                    <h3>${flight.airline} - ${flight.flightNumber}</h3>
                    <p>${flight.from} → ${flight.to}</p>
                    <p style="color: #10b981; font-size: 1.5em; font-weight: 700;">₹${flight.price.toLocaleString('en-IN')}</p>
                </div>

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="passengerName" placeholder="As per ID proof" required>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="passengerEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="passengerPhone" placeholder="+91 1234567890" required>
                </div>

                <div class="form-group">
                    <label>Age *</label>
                    <input type="number" id="passengerAge" placeholder="18" required>
                </div>

                <button class="btn btn-success" style="width: 100%; margin-top: 20px;" onclick="confirmBooking()">
                    Proceed to Payment
                </button>
            `;

            modal.classList.add('active');
        }

        // Confirm booking
        async function confirmBooking() {
            const name = document.getElementById('passengerName').value;
            const email = document.getElementById('passengerEmail').value;
            const phone = document.getElementById('passengerPhone').value;
            const age = document.getElementById('passengerAge').value;

            if (!name || !email || !phone || !age) {
                alert('Please fill all fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        flightId: selectedFlight.id,
                        passenger: { name, email, phone, age: parseInt(age) },
                        contactInfo: { email, phone }
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    currentBooking = data.booking;
                    closeModal('bookingModal');
                    generateQRPayment();
                }
            } catch (error) {
                console.error('Error creating booking:', error);
                alert('Booking failed. Please try again.');
            }
        }

        // Generate QR payment
        async function generateQRPayment() {
            const modal = document.getElementById('paymentModal');
            const content = document.getElementById('paymentContent');

            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Generating QR code...</p></div>';
            modal.classList.add('active');

            try {
                const response = await fetch(`${API_URL}/payment/generate-qr`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bookingId: currentBooking.id,
                        amount: currentBooking.totalAmount,
                        currency: currentBooking.currency
                    })
                });

                const data = await response.json();

                content.innerHTML = `
                    <div style="text-align: center;">
                        <h3>Booking Reference: ${currentBooking.bookingReference}</h3>
                        <p style="color: #10b981; font-size: 1.5em; font-weight: 700; margin: 10px 0;">
                            ₹${currentBooking.totalAmount.toLocaleString('en-IN')}
                        </p>
                    </div>

                    <div class="qr-container">
                        <h3>Scan to Pay</h3>
                        <img src="${data.payment.qrCode}" class="qr-code" alt="Payment QR Code">
                        <p style="color: #666; margin-top: 15px;">
                            Scan this QR code with any UPI app<br>
                            (Google Pay, PhonePe, Paytm, etc.)
                        </p>
                        <p style="color: #ef4444; font-size: 0.9em; margin-top: 10px;">
                            Expires in 15 minutes
                        </p>
                    </div>

                    <button class="btn btn-success" style="width: 100%;" onclick="simulatePayment('${data.payment.id}')">
                        I've Paid (Simulate Payment)
                    </button>

                    <p style="text-align: center; color: #666; font-size: 0.9em; margin-top: 15px;">
                        In production, payment will be verified automatically
                    </p>
                `;
            } catch (error) {
                console.error('Error generating QR:', error);
                content.innerHTML = '<p style="color: red; text-align: center;">Failed to generate QR code</p>';
            }
        }

        // Simulate payment
        async function simulatePayment(paymentId) {
            try {
                const response = await fetch(`${API_URL}/payment/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paymentId: paymentId,
                        transactionId: `TXN${Date.now()}`
                    })
                });

                const data = await response.json();

                if (data.success) {
                    closeModal('paymentModal');
                    showBoardingPass();
                }
            } catch (error) {
                console.error('Error verifying payment:', error);
            }
        }

        // Show boarding pass
        async function showBoardingPass() {
            const modal = document.getElementById('boardingPassModal');
            const content = document.getElementById('boardingPassContent');

            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Generating boarding pass...</p></div>';
            modal.classList.add('active');

            try {
                const response = await fetch(`${API_URL}/bookings/${currentBooking.id}/boarding-pass`);
                const data = await response.json();

                const bp = data.boardingPass;

                content.innerHTML = `
                    <div class="success-message">
                        <h3>🎉 Booking Confirmed!</h3>
                        <p>Your payment was successful</p>
                    </div>

                    <div class="boarding-pass">
                        <div class="boarding-pass-header">
                            <h2>✈️ Boarding Pass</h2>
                            <p style="font-size: 1.2em; font-weight: 600;">${bp.bookingReference}</p>
                        </div>

                        <div class="boarding-pass-details">
                            <div class="detail-item">
                                <div class="detail-label">Passenger</div>
                                <div class="detail-value">${bp.passengerName}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Flight</div>
                                <div class="detail-value">${bp.flightNumber}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">From</div>
                                <div class="detail-value">${bp.from.split('(')[0]}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">To</div>
                                <div class="detail-value">${bp.to.split('(')[0]}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Seat</div>
                                <div class="detail-value">${bp.seat}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Gate</div>
                                <div class="detail-value">${bp.gate}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Boarding Time</div>
                                <div class="detail-value">${new Date(bp.boardingTime).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Departure</div>
                                <div class="detail-value">${new Date(bp.departure).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</div>
                            </div>
                        </div>

                        <div style="text-align: center; margin-top: 20px;">
                            <img src="${bp.qrCode}" style="max-width: 250px; background: white; padding: 10px; border-radius: 10px;" alt="Boarding Pass QR">
                            <p style="margin-top: 10px; font-size: 0.9em;">Scan at airport security & boarding gate</p>
                        </div>
                    </div>

                    <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="downloadBoardingPass()">
                        📥 Download Boarding Pass
                    </button>
                `;
            } catch (error) {
                console.error('Error generating boarding pass:', error);
            }
        }

        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Download boarding pass
        function downloadBoardingPass() {
            alert('Boarding pass download feature - In production, this would generate a PDF');
        }
    </script>
</body>
</html>
